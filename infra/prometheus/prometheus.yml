# Scrapes the mock BMC fast enough that a CRAC failure becomes alerts within
# the 60 s the A1 definition of done allows.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mock-bmc
    static_configs:
      - targets: ["mock-bmc:8100"]
