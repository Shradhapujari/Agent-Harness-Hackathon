# Three look-alike apps so a drain has something real to move, and every node
# carries pods so any of the three BMCs is a meaningful thing to power-cycle.
#
# The control-plane node carries the default NoSchedule taint, so the pods
# tolerate it explicitly. Without that only the two workers hold pods, and
# R4-N01 becomes a node the agent can see but never affect.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    hush.io/rack: R4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: demo
spec:
  # 3 replicas and minAvailable 1: a drain has to evict and wait, like the real
  # thing, but it always finishes instead of blocking forever.
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
