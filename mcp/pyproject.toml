[project]
name = "hush-mcp"
version = "0.1.0"
description = "MCP servers exposing the simulated data center to the Hush agent"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.12",
    "httpx>=0.27",
]

[project.scripts]
hush-mcp = "hush_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hush_mcp"]
